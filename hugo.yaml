# Project Kinkajou documentation site
baseURL: https://kinkajou.dev/
locale: en-us
title: Project Kinkajou
theme: hextra

enableRobotsTXT: true
enableGitInfo: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Projects
      pageRef: /projects
      weight: 1
    - name: Bridge
      pageRef: /bridge
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - name: Download
      url: https://github.com/phai-ting/kinkajou-bridge/releases
      weight: 2

params:
  description: Project Kinkajou — tools that connect your streaming and maker workflows.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: kinkajou-face.png
      dark: kinkajou-face.png
      width: 44
      height: 32

  page:
    width: normal

  theme:
    default: dark
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: false
